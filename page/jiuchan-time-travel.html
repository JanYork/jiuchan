<body>
    <div class="scene">
        <div class="wrap">
            <div class="wall wall-right"></div>
            <div class="wall wall-left"></div>
            <div class="wall wall-top"></div>
            <div class="wall wall-bottom"></div>
            <div class="wall wall-back"></div>
        </div>
        <div class="wrap">
            <div class="wall wall-right"></div>
            <div class="wall wall-left"></div>
            <div class="wall wall-top"></div>
            <div class="wall wall-bottom"></div>
            <div class="wall wall-back"></div>
        </div>
    </div>

    <div class="container animation_steps">
        <div id="content" class="content element step3">
            <p id="content-decorate">即将抵达</p>
            <h2 id="content-name"></h2>
            <p id="content-email"></p>
            <p id="content-blog"></p>
            <p id="content-subscribe"></p>
            <p id="content-signature"></p>
        </div>

        <div class="animation_steps">
            <h2 id="step1" class="element step1">正在尝试抓捕春秋蝉...</h2>
            <h2 id="step2" class="element step2">正在从空间裂缝穿梭...</h2>
        </div>
    </div>

    <script>
        function jump(url) {
            window.location.href = `https://${url}`;
        }

        const start = (url) => {
            setTimeout(() => {
                jump(url);
            }, 6000);
        };

        randomWebsite().then(data => {
            document.getElementById('step1').classList.remove('hide');
            document.getElementById('content-name').textContent = `< ${data.name} >`;

            if (data.signature) {
                document.getElementById('content-signature').textContent = `${data.signature ? " “ " +data.signature + " “ " : ''}`;
            } else {
                document.getElementById('content-signature').style.display = 'none';
            }

            const url = `${data.domain}${data.entry ? data.entry : ''}`;

            start(url);
        });
    </script>
