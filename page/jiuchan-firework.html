<body>
    <div class="container">
        <div id="content" class="">
            <h2 id="content-name"></h2>
            <p id="content-email"></p>
            <p id="content-blog"></p>
            <p id="content-subscribe"></p>
            <p id="content-signature"></p>
        </div>

        <div class="animation_steps">
            <h2 id="step1" class="">喜气迎新年 蛇年心想事成</h2>
            <h2 id="step2" class="">揪蝉祝大家 2025新年快乐</h2>
        </div>
    </div>

    <script>
        function jump(url) {
            window.location.href = `https://${url}`;
        }

        const start = (url) => {
            setTimeout(() => {
                jump(url);
            }, 5000);
        };

        randomWebsite().then(data => {
            document.getElementById('step1').classList.remove('hide');
            document.getElementById('content-name').textContent = `即将到达 → “${data.name}”` || '未提供名称';

            if (data.signature) {
                document.getElementById('content-signature').textContent = `${data.signature}`;
            } else {
                document.getElementById('content-signature').style.display = 'none';
            }

            const url = `${data.domain}${data.entry ? data.entry : ''}`;

            start(url);
        });
    </script>

    <script src='../js/firework/tsparticles.preset.fireworks.bundle.js'></script>
